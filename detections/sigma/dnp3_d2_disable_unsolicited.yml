# =============================================================================
# Substation detection D2 — DNP3 disable unsolicited responses (blinding)
# =============================================================================
# Engine: Sigma (Tier-1, evaluated over the .jsonl event log — PRD.md §6.5).
# Rationale, data source and the full false-positive profile live in
# detections/docs/D2-disable-unsolicited.md (the Detection Contract doc, §6.6).
#
# Keys on the DISABLE_UNSOLICITED command + an allow-list of permitted sources,
# NOT volume: suppressing an outstation's spontaneous event reporting blinds the
# master to alarms/telemetry. A sanctioned disable from the real master (e.g.
# during maintenance) stays quiet; a disable from any other source fires.
# -----------------------------------------------------------------------------
title: DNP3 Disable Unsolicited Responses From Unauthorized Source
id: 2a9d4c70-8e51-4b3a-9f6d-0c4b2e7a15de
status: stable
description: |
  A DNP3 DISABLE_UNSOLICITED request from a source that is not the allow-listed
  master. Substation detection D2 (PRD.md §5.2): disabling unsolicited responses
  suppresses the outstation's spontaneous event/telemetry reporting, blinding the
  operator (Inhibit Response Function). Keyed by command AND source allow-list, so
  a sanctioned maintenance disable from the real master stays quiet (PRD.md §8).
references:
  - https://attack.mitre.org/techniques/T1691/002/
  - https://attack.mitre.org/techniques/T0878/
  - PRD.md §5.2 (D2); detections/docs/D2-disable-unsolicited.md
author: Substation
date: 2026-06-04
logsource:
  product: ot
  service: dnp3
detection:
  # A DNP3 request to disable unsolicited reporting. func_name carries the Zeek
  # DNP3::function_codes name (docs/schema.md). direction: request keys on the
  # command; conn.orig_h is the issuing source.
  disable_unsolicited:
    proto: dnp3
    direction: request
    func_name: DISABLE_UNSOLICITED
  # The permitted control source (allow-listed master). A disable from any other
  # source is the blinding signal (source derived through is_orig, docs/schema.md).
  authorized_source:
    conn.orig_h: '10.0.1.10' # master-1 — the allow-listed SCADA master
  condition: disable_unsolicited and not authorized_source
fields:
  - conn.orig_h
  - func_name
falsepositives:
  - A sanctioned maintenance window where the allow-listed master disables
    unsolicited reporting is handled by the allow-list — the master is listed, so
    its disables stay quiet. Keep the allow-list current as masters change.
  - A redundant/standby master that legitimately re-negotiates unsolicited mode
    from an unlisted address — pre-authorize it (add to the allow-list).
level: high
tags:
  - attack.inhibit-response-function
  - attack.t1691.002
  - attack.t0878
