# =============================================================================
# Substation detection S2 — Unauthorized S7 program / data-block write or download
# =============================================================================
# Engine: Sigma (Tier-1, evaluated over the .jsonl event log — PRD.md §6.5).
# Rationale, data source and the full false-positive profile live in
# detections/docs/S2-program-write-download.md (the Detection Contract doc, §6.6).
#
# Keys on the program/block-transfer commands + an allow-list of permitted
# engineering sources, NOT "any write". Plain Write Variable (operator setpoint
# writes) is deliberately EXCLUDED so routine HMI tag writes never fire this — the
# OT-realism guardrail (docs/design.md §8). A block download (Request Download /
# Download Block / Download Ended) or the PI service that activates a downloaded
# block (_INSE) from a source that is not the allow-listed EWS fires.
#
# S7comm-plus is deliberately not matched: Set Variable is routine HMI traffic and
# Create/Delete Object open and close every session, so function codes alone
# cannot separate a program download from normal S7-1200/1500 operation.
# -----------------------------------------------------------------------------
title: S7 Program / Data-Block Download From Unauthorized Source
id: 9d8c2f47-1b6e-4a30-8c5d-7e2a9f1b04c6
status: experimental
description: |
  An S7comm program/data-block transfer (Request Download / Download Block / Download
  Ended), or the PLC Control service that activates a downloaded block (_INSE), from a
  source that is not the allow-listed engineering workstation. Substation detection S2:
  downloading program or data blocks replaces the control logic running on the PLC
  (Program Download). Keyed by transfer command AND source allow-list — and excluding
  plain operator tag writes — so legitimate engineering downloads and routine HMI
  writes stay quiet.
references:
  - https://attack.mitre.org/techniques/T0843/
  - https://github.com/NotACop38/SubStation/blob/main/detections/docs/S2-program-write-download.md
author: Substation
date: 2026-06-04
modified: 2026-09-26
logsource:
  product: ot
  service: s7comm
detection:
  # An S7 block-transfer request, or activation of a downloaded block. func_name
  # carries the ICSNPP s7comm.log function_name; the PLC Control service is in
  # detail.subfunction_code (docs/schema.md). conn.orig_h is the issuing source.
  program_transfer:
    - proto: s7comm
      direction: request
      func_name:
        - Request Download
        - Download Block
        - Download Ended
    - proto: s7comm
      direction: request
      func_name: PLC Control
      detail.subfunction_code: _INSE
  # The permitted engineering source (allow-listed EWS). A program transfer from any
  # other source is unauthorized (source derived through is_orig, docs/schema.md -> conn).
  # Synthetic policy: source permission is limited to this asset and service.
  authorized_channel:
    conn.orig_h: '10.0.4.10' # ews-1 — the allow-listed engineering workstation
    conn.resp_h: '10.0.4.50'
    conn.resp_p: 102
  condition: program_transfer and not authorized_channel
fields:
  - conn.orig_h
  - conn.resp_h
  - conn.resp_p
  - func_name
falsepositives:
  - A sanctioned engineering download from the allow-listed EWS is handled by the
    allow-list — the EWS address is listed, so its downloads stay quiet. The benign
    baseline exercises exactly this and produces 0 hits. Keep the allow-list current.
  - A new or relocated engineering station whose address is not yet allow-listed will
    fire on its legitimate downloads — pre-authorize it for the maintenance window.
  - Plain operator setpoint writes (Write Variable) and S7comm-plus variable access
    are intentionally not matched, so routine HMI tag reads and writes never trip
    this detection.
level: high
tags:
  - attack.lateral-movement
  - attack.t0843
