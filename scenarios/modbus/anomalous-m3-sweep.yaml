# =============================================================================
# Anomalous (M3) — function-code / unit-ID sweep (diversity, NOT volume)
# =============================================================================
# M3 (PRD.md §5.1, §8): ONE source touching many function codes and/or sweeping
# unit IDs in a short window. The signal is DIVERSITY/SWEEP, deliberately NOT raw
# request rate — SCADA masters poll constantly, so a volume threshold would fire
# on normal operation (PRD.md §8). This scenario therefore uses only a handful of
# requests, each a DIFFERENT function code against a DIFFERENT unit id, in a tight
# window: low volume, high diversity.
#
# Must fire M3 only:
#   * M1 stays quiet — the sweep is read-only (no write functions).
#   * M2 stays quiet — every function code used is legal/standard (the anomaly is
#     the breadth of codes/units from one source, not any illegal code).
# -----------------------------------------------------------------------------

name: modbus-anomalous-m3-sweep
description: >-
  A single scanning host (10.0.0.66) walks several Modbus function codes across
  several unit ids on the PLC in a short window — high function/unit diversity at
  low request volume. Fires M3 (function-code/unit-id sweep); stays quiet on M1
  (read-only) and M2 (all codes legal).

protocol: modbus
label: anomalous

timing:
  start: 0.0
  default_interval: 0.5     # tight window — a sweep, but only a few requests.

actors:
  - id: hmi-1            # normal polling continues during the sweep.
    role: hmi
    host: 10.0.0.10
  - id: scanner-1       # the single sweeping source.
    role: master
    host: 10.0.0.66
  - id: plc-1
    role: plc
    host: 10.0.0.50
    port: 502

exchanges:
  # --- normal background polling --------------------------------------------
  - source: hmi-1
    target: plc-1
    function: ReadHoldingRegisters
    offset: 0.0
    params: { unit_id: 1, address: 0, quantity: 10 }

  # --- the sweep: 4 distinct function codes over 4 distinct unit ids (M3) ----
  # One request each — diversity is the signal, not volume.
  - source: scanner-1
    target: plc-1
    function: ReadCoils
    offset: 1.0
    params: { unit_id: 1, address: 0, quantity: 1 }
  - source: scanner-1
    target: plc-1
    function: ReadDiscreteInputs
    offset: 1.5
    params: { unit_id: 2, address: 0, quantity: 1 }
  - source: scanner-1
    target: plc-1
    function: ReadInputRegisters
    offset: 2.0
    params: { unit_id: 3, address: 0, quantity: 1 }
  - source: scanner-1
    target: plc-1
    function: ReadHoldingRegisters
    offset: 2.5
    params: { unit_id: 4, address: 0, quantity: 1 }

exercises:
  fires:
    - M3   # one source, many function codes across many unit ids, short window.
  quiet:
    - M1   # the sweep is read-only — no write functions.
    - M2   # every function code is legal; the anomaly is breadth, not illegality.
