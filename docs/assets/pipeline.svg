<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Two paths from one scenario</title>
  <desc id="desc">One YAML scenario model emits JSONL for Tier 1 Sigma tests and PCAP for Tier 2 Zeek/ICSNPP field checks and stateful rules. Tier 2 runs separately from the default demo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10" fill="none" stroke="#86a6a0" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="6" fill="#102b2b"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-anchor="middle">
    <rect x="184" y="24" width="432" height="68" rx="4" fill="#193b38" stroke="#527c72"/>
    <text x="400" y="66" fill="#f2efe6" font-size="26" font-weight="600">YAML → one scenario model</text>
    <path d="M400 92V118H208V148M400 118H592V148" fill="none" stroke="#86a6a0" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M208 137V148" stroke="#86a6a0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="32" y="158" width="352" height="214" rx="4" fill="#163632" stroke="#527c72"/>
    <rect x="416" y="158" width="352" height="214" rx="4" fill="#26372f" stroke="#84724e"/>
    <text x="208" y="194" fill="#76c6b3" font-size="20" font-weight="600">TIER 1 · PYTHON</text>
    <text x="592" y="194" fill="#e3c48c" font-size="20" font-weight="600">TIER 2 · ZEEK / ICSNPP</text>
    <text x="208" y="240" fill="#f2efe6" font-size="30" font-weight="600">JSONL</text>
    <text x="592" y="240" fill="#f2efe6" font-size="30" font-weight="600">PCAP</text>
    <path d="M208 254V278M592 254V278" fill="none" stroke="#86a6a0" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M208 268V278" stroke="#86a6a0" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="208" y="313" fill="#f2efe6" font-size="26">Sigma rules</text>
    <text x="592" y="313" fill="#f2efe6" font-size="26">Fields + stateful rules</text>
    <text x="208" y="346" fill="#b6ccc5" font-size="20">Hits + ATT&amp;CK map</text>
    <text x="592" y="346" fill="#d4c8ae" font-size="20">Separate verification run</text>
  </g>
</svg>
